#{extends 'main.html' /}
#{set title:'Agendamento de Consulta' /}

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>
  :root {
    --bs-primary: #0e72bc;
    --bs-primary-rgb: 14, 114, 188;
  }
  .btn-primary {
    --bs-btn-hover-bg: #0c5f9c;
    --bs-btn-hover-border-color: #0c5f9c;
    --bs-btn-active-bg: #0a5285;
    --bs-btn-active-border-color: #0a5285;
  }
</style>

<div class="bg-primary bg-gradient text-white text-center py-5 mb-5">
  #{if c?.id}
  <h1 class="fw-bold">Edição de Consulta</h1>
  #{/if}
  #{else}
  <h1 class="fw-bold">Agendar Consulta</h1>
  #{/else}
  <p class="lead mb-0">Preencha os dados abaixo para confirmar o agendamento</p>
</div>

<div class="container mb-5">
  <div class="row justify-content-center">
    <div class="col-lg-7">

      <div class="mb-4">
        <a href="@{Consultas.cadastro}" class="text-decoration-none"><i class="bi bi-arrow-left"></i> Voltar ao Menu</a>
        <span class="mx-2">|</span>
        <a href="@{Consultas.listar}" class="text-decoration-none">Ver Consultas Cadastradas</a>
      </div>

      #{if erro}
      <div class="alert alert-danger">${erro}</div>
      #{/if}

      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">

          <form action="/consultas/salvar" method="post">

            <input type="hidden" name="c.id" value="${c?.id}"/>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label"><i class="bi bi-calendar-event text-primary"></i> Data da Consulta</label>
                <input type="date" class="form-control" name="c.data" value="${c?.data}" placeholder="Ex: 20/07/2026" required/>
              </div>
              <div class="col-md-6">
                <label class="form-label"><i class="bi bi-clock text-primary"></i> Hora da Consulta</label>
                <input type="text" class="form-control" name="c.hora" value="${c?.hora}" placeholder="Ex: 14:30" required/>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label"><i class="bi bi-person text-primary"></i> Paciente</label>
              <select class="form-select" name="c.cliente.id" required>
                <option value="">Selecione o paciente...</option>
                #{list items: clientes, as: 'cliente' }
                <option value="${cliente.id}" ${cliente.id == c.cliente?.id ? 'selected' : ''}>
                  ${cliente.nome}
                </option>
                #{/list}
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label"><i class="bi bi-person-badge text-primary"></i> Médico Especialista</label>
              <select class="form-select" name="c.medico.id" required>
                <option value="">Selecione o médico...</option>
                #{list items: medicos, as: 'medico' }
                <option value="${medico.id}" ${medico.id == c.medico?.id ? 'selected' : ''}>
                  ${medico.nome} (${medico.especialidade})
                </option>
                #{/list}
              </select>
            </div>

            <div class="mb-4">
              <label class="form-label"><i class="bi bi-chat-left-text text-primary"></i> Observações</label>
              <textarea class="form-control" name="c.obs" rows="3">${c?.obs}</textarea>
            </div>

            <div class="d-grid">
              <button type="submit" class="btn btn-primary btn-lg">Salvar Agendamento</button>
            </div>
          </form>

        </div>
      </div>

    </div>
  </div>
</div>
