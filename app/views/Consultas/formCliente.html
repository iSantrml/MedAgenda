#{extends 'main.html' /}
#{set title:'Cadastro de Paciente' /}

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>
  :root {
    --bs-primary: #0e72bc;
    --bs-primary-rgb: 14, 114, 188;
  }
  .btn-primary {
    --bs-btn-hover-bg: #0c5f9c;
    --bs-btn-hover-border-color: #0c5f9c;
    --bs-btn-active-bg: #0a5285;
    --bs-btn-active-border-color: #0a5285;
  }
</style>

<div class="bg-primary bg-gradient text-white text-center py-5 mb-5">
  <h1 class="fw-bold">Cadastrar Paciente</h1>
  <p class="lead mb-0">Preencha os dados abaixo para cadastrar um novo paciente</p>
</div>

<div class="container mb-5">
  <div class="row justify-content-center">
    <div class="col-lg-6">

      <div class="mb-4">
        <a href="@{Consultas.cadastro}" class="text-decoration-none"><i class="bi bi-arrow-left"></i> Voltar ao Menu</a>
      </div>

      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">

          <form action="/consultas/salvarCliente" method="post">

            <div class="mb-3">
              <label class="form-label"><i class="bi bi-person text-primary"></i> Nome</label>
              <input type="text" class="form-control" name="c.nome" value="${c?.nome}" placeholder="Nome do paciente" required/>
            </div>

            <div class="mb-3">
              <label class="form-label"><i class="bi bi-card-text text-primary"></i> CPF</label>
              <input type="text" class="form-control" name="c.cpf" value="${c?.cpf}" placeholder="Ex: 000.000.000-00" required/>
            </div>

            <div class="mb-4">
              <label class="form-label"><i class="bi bi-telephone text-primary"></i> Telefone</label>
              <input type="text" class="form-control" name="c.telefone" value="${c?.telefone}" placeholder="Ex: (84) 90000-0000" required/>
            </div>

            <div class="d-grid">
              <button type="submit" class="btn btn-primary btn-lg">Salvar Paciente</button>
            </div>
          </form>

        </div>
      </div>

    </div>
  </div>
</div>
