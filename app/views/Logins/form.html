#{extends 'main.html' /}
#{set title:'Login' /}

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>
  :root { --bs-primary: #0e72bc; --bs-primary-rgb: 14, 114, 188; }
  body { background: #f2f6fa; }
  .btn-primary {
    --bs-btn-hover-bg: #0c5f9c; --bs-btn-hover-border-color: #0c5f9c;
    --bs-btn-active-bg: #0a5285; --bs-btn-active-border-color: #0a5285;
  }
  .hero { padding: 3rem 1rem 6rem; text-align: center; color: #fff;
          background: linear-gradient(135deg, #0a5285, #0e72bc 60%, #3b9be0); }
  .pull-up { margin-top: -3.5rem; }
  .card-soft { border: 0; border-radius: 1rem; box-shadow: 0 8px 30px rgba(14, 114, 188, .1); }
  .lift { transition: .2s; }
  .lift:hover { transform: translateY(-5px); box-shadow: 0 14px 34px rgba(14, 114, 188, .2); }
  .icon-circle { width: 64px; height: 64px; border-radius: 50%; background: #e8f2fa; color: #0e72bc;
                 display: inline-flex; align-items: center; justify-content: center; font-size: 1.8rem; }
  .input-group-text { background: #e8f2fa; color: #0e72bc; }
  .form-control:focus, .form-select:focus { border-color: #0e72bc; box-shadow: 0 0 0 .2rem rgba(14, 114, 188, .2); }
</style>

<div class="row g-0 min-vh-100">

  <div class="col-lg-6 hero d-none d-lg-flex flex-column justify-content-center">
    <i class="bi bi-heart-pulse" style="font-size:4rem"></i>
    <h1 class="fw-bold display-5">Clínica</h1>
    <p class="lead">Gerencie consultas e pacientes de forma simples</p>
  </div>

  <div class="col-lg-6 d-flex align-items-center justify-content-center p-4">
    <div class="w-100" style="max-width:400px">
      <h2 class="fw-bold">Acesso ao Sistema</h2>
      <p class="text-muted">Entre com seus dados para acessar a clínica</p>

      #{if flash.error}
      <div class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill"></i> ${flash.error}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      #{/if}
      #{if flash.success}
      <div class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill"></i> ${flash.success}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      #{/if}

      <div class="card card-soft">
        <div class="card-body p-4">
          <form action="@{Logins.logar}" method="post">
            <div class="mb-3">
              <label class="form-label fw-semibold">Login / CRM / CPF</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" name="login" value="${flash.login}" placeholder="Digite seu login, CRM ou CPF" required />
              </div>
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold">Senha</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" name="senha" placeholder="Digite sua senha" required />
              </div>
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-primary btn-lg">Entrar</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
